server {
    listen 3000;
    server_name localhost;
    server_tokens off;

    root /usr/share/nginx/html;
    index _shell.html index.html;

    # --- GZIP OPTIMIZATIONS ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000; # Don't waste CPU compressing tiny files
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml font/woff font/woff2;

    # --- SECURITY HEADERS ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # --- STATIC ASSETS (Vite Hashed Files) ---
    location ~* \.(js|css|woff2?|ttf|otf|eot|ico|png|jpg|jpeg|gif|webp|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- API PROXY ---
    location /api/ {
        proxy_pass ${BACKEND_URL}/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- SPA ROUTING & HTML CACHE BUSTING ---
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        expires 0;

        try_files $uri $uri/ /_shell.html;
    }
}