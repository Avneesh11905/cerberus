name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BACKEND_IMAGE_NAME: avneesh11905/cerberus-fastapi

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      alembic: ${{ steps.filter.outputs.alembic }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4.0.1
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '!backend/**/*.md'
            frontend:
              - 'frontend/**'
              - '!frontend/**/*.md'
            alembic:
              - 'backend/alembic/versions/**'
              - 'backend/alembic/env.py'
              - 'backend/alembic.ini'
            deploy:
              - '**'
              - '!frontend/**'
              - '!**/*.md'
              - '!LICENSE'
              - '!.gitignore'

  python-ci:
    needs: changes
    if: | 
      needs.changes.outputs.backend == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.8.0
        ports:
          - 6379:6379
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cerberus
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CACHE_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_URL: redis://localhost:6379/2
      PGSQL_URL: postgresql://user:password@localhost:5432/cerberus
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv and set up Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: '3.14'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Set up environment
        run: |
          cp ../.env.example .env
          uv run scripts/generate_keys.py

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type-check (mypy)
        run: uv run mypy . --check-untyped-defs

      - name: Run Migrations (alembic)
        run: uv run alembic upgrade head

      - name: Architecture Validation (pytest-archon)
        run: uv run pytest tests/test_architecture.py

      - name: Run tests (pytest)
        env:
          CERBERUS_ENVIRONMENT: test
        run: uv run pytest tests/ --ignore=tests/test_architecture.py --cov

      - name: Security Scan (bandit)
        run: uv run bandit -c pyproject.toml -r src/

  frontend-ci:
    needs: changes
    if: |
      needs.changes.outputs.frontend == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint and typecheck
        run: |
          bun run lint
          bun run typecheck

      - name: Run unit tests
        run: bun run test

      - name: Build frontend
        run: bun run build

      - name: Format check (prettier)
        run: bun run check

  backend-build:
    needs: [changes, python-ci]
    if: |
      always() &&
      (needs.changes.outputs.backend == 'true' ||
      github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      needs.python-ci.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read backend version
        id: version
        run: |
          VERSION=$(grep '^BACKEND_VERSION=' version.env | cut -d '=' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE_NAME }}:latest
            ${{ env.BACKEND_IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.BACKEND_IMAGE_NAME }}:buildcache,mode=max

  backend-deploy:
    needs: [changes, backend-build]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.deploy == 'true' ||
      github.event_name == 'workflow_dispatch') &&
      (needs.backend-build.result == 'success' ||
      needs.backend-build.result == 'skipped')
    runs-on: [self-hosted, home-server]
    permissions: {}
    steps:
      - name: Pull latest images
        working-directory: /home/cerberus/v1
        run: docker compose pull

      - name: Run Alembic migrations
        if: |
          needs.changes.outputs.alembic == 'true' ||
          github.event_name == 'workflow_dispatch'
        working-directory: /home/cerberus/v1
        run: |
          echo "Schema changes detected â€” running Alembic migrations..."
          docker compose --profile migrate run --rm cerb-migrate
          echo "Migrations complete â€” container auto-deleted."

      - name: Start / update application stack
        working-directory: /home/cerberus/v1
        run: |
          docker compose up -d
          docker compose restart cerb-nginx

      - name: Health Check
        working-directory: /home/cerberus/v1
        run: |
          echo "Waiting for services to stabilize..."
          docker compose ps

          echo "Checking Backend (Health)..."
          curl -sS --fail \
            --retry 12 \
            --retry-delay 5 \
            --retry-connrefused \
            -H "Host: cerberus-api.aymahajan.in" \
            http://localhost:8001/health

          echo "All services are up and healthy!"

  frontend-deploy:
    needs: [changes, frontend-ci]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.frontend == 'true' ||
      github.event_name == 'workflow_dispatch') &&
      needs.frontend-ci.result == 'success'
    runs-on: ubuntu-latest

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    defaults:
      run:  
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Remove old Vercel configuration
        run: rm -rf .vercel
      
      - name: Verify Vercel project access
        run: |
          bunx vercel whoami --token="$VERCEL_TOKEN"
          echo "Attempting to access configured project..."
          bunx vercel project ls --token="$VERCEL_TOKEN"

      - name: Pull Vercel production configuration
        run: bunx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build for Vercel
        run: bunx vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        run: bunx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"