[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic==1.18.5",
    "argon2-cffi==25.1.0",
    "asyncpg==0.31.0",
    "authlib==1.7.2",
    "celery-batches>=0.11",
    "celery[redis]>=5.6.3",
    "cryptography>=41.0.0",
    "email-validator==2.3.0",
    "fastapi==0.139.0",
    "gunicorn==26.0.0",
    "httpx==0.28.1",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "passlib[argon2]==1.7.4",
    "pydantic-settings==2.14.2",
    "pyjwt[crypto]==2.13.0",
    "python-multipart==0.0.32",
    "redis<6.5",
    "resend==2.33.0",
    "sqlalchemy==2.0.51",
    "user-agents>=2.2.0",
    "uuid6==2025.0.1",
    "uvicorn[standard]==0.51.0",
]

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.15.21",
    "types-authlib>=1.6.11.20260518",
    "python-dotenv>=1.0.1",
    "pytest-httpx>=0.36.2",
    "respx>=0.22.0",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=3.15.0",
    "factory-boy>=3.3.0",
    "locust>=2.29.0",
    "pytest-dotenv>=0.5.2",
    "testcontainers[postgres,redis]>=4.4.1",
    "pytest-celery>=1.3.0",
    "time-machine>=3.2.0",
    "pytest-alembic>=0.12.1",
    "pytest-mock>=3.15.1",
    "faker>=40.28.1",
    "bandit>=1.9.4",
    "libcst>=1.8.6",
    "pytest-archon>=0.0.7",
    "vulture>=2.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
env_files = ["tests/.env.test"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    "ignore:.*Accessing argon2.__version__ is deprecated.*:DeprecationWarning:passlib.handlers.argon2",
    "ignore:.*wait_container_is_ready.*:DeprecationWarning",
    "ignore:.*`httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "smoke: mark a test as a smoke test.",
    "sanity: mark a test as a sanity check."
]

[tool.mypy]
python_version = "3.14"
exclude = ["^scratch/"]
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "src/core/database.py", 
    "src/core/container.py"
]

[tool.coverage.report]
fail_under = 70
show_missing = true
